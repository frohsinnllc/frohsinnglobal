<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Etsy-Verbindung — Frohsinn LLC</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: #faf7f0; color: #2f2a24;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .card {
      width: 100%; max-width: 640px; background: #fff; border: 1px solid #e6e0d4;
      border-radius: 16px; padding: 32px; box-shadow: 0 8px 30px rgba(0,0,0,.06);
    }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: #8a8378; font-size: 14px; margin: 0 0 24px; }
    .label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #8a8378; margin-bottom: 6px; }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; word-break: break-all;
      background: #faf7f0; border: 1px solid #e6e0d4; border-radius: 10px; padding: 14px; user-select: all;
    }
    .block { margin-bottom: 18px; }
    button {
      appearance: none; border: 0; border-radius: 10px; padding: 12px 18px; font-size: 15px; font-weight: 600;
      background: #2f2a24; color: #fff; cursor: pointer;
    }
    button:active { opacity: .85; }
    .ok { color: #2e7d52; font-weight: 600; }
    .err { color: #b3261e; }
    .hint { font-size: 13px; color: #8a8378; margin-top: 18px; line-height: 1.5; }
    @media (prefers-color-scheme: dark) {
      body { background: #17150f; color: #f0ece3; }
      .card { background: #201d16; border-color: #35301f; }
      .code { background: #17150f; border-color: #35301f; }
      button { background: #f0ece3; color: #17150f; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Etsy-Verbindung</h1>
    <p class="sub">Diese Seite empfängt nur den Freigabe-Code. Es passiert nichts automatisch.</p>
    <div id="out"></div>
    <p class="hint">
      Kopiere den Code oben und schick ihn an Claude — damit wird die Verbindung abgeschlossen.
      Der Code ist nur wenige Minuten gültig und erlaubt allein noch keinen Zugriff.
    </p>
  </div>

  <script>
    (function () {
      var p = new URLSearchParams(window.location.search);
      var code = p.get('code');
      var state = p.get('state');
      var error = p.get('error');
      var out = document.getElementById('out');

      function block(label, value) {
        var d = document.createElement('div');
        d.className = 'block';
        var l = document.createElement('div');
        l.className = 'label';
        l.textContent = label;
        var c = document.createElement('div');
        c.className = 'code';
        c.textContent = value;
        d.appendChild(l); d.appendChild(c);
        return d;
      }

      if (error) {
        var e = document.createElement('p');
        e.className = 'err';
        e.textContent = 'Etsy meldet: ' + error + (p.get('error_description') ? ' — ' + p.get('error_description') : '');
        out.appendChild(e);
        return;
      }

      if (!code) {
        var n = document.createElement('p');
        n.textContent = 'Kein Code in der Adresse. Diese Seite wird nach dem Klick auf „Zulassen“ bei Etsy automatisch mit dem Code aufgerufen.';
        out.appendChild(n);
        return;
      }

      var ok = document.createElement('p');
      ok.className = 'ok';
      ok.textContent = '✓ Freigabe erhalten';
      out.appendChild(ok);
      out.appendChild(block('Code', code));
      if (state) out.appendChild(block('State', state));

      var btn = document.createElement('button');
      btn.textContent = 'Code kopieren';
      btn.addEventListener('click', function () {
        navigator.clipboard.writeText(code).then(function () {
          btn.textContent = '✓ Kopiert';
        }, function () {
          btn.textContent = 'Kopieren fehlgeschlagen — bitte markieren';
        });
      });
      out.appendChild(btn);
    })();
  </script>
</body>
</html>
